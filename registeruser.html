

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therahub - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
            height: 600px;
        }

        .logo img {
            width: 60px;
            margin-bottom: 20px;
            height: 60px
        }

        .title {
            font-size: 2em;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .register-form {
            display: flex;
            flex-direction: column;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }

        .input-group i {
            margin-right: 10px;
            color: #666;
        }

        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-register {
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-register:hover {
            background-color: #0056b3;
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #007BFF;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="C:\Users\SAI SINDHU\OneDrive\Desktop\voices\THERAfusion.png" alt="Therahub Logo"> <!-- Replace logo.png with your logo file -->
        </div>
        <h1 class="title">Therafusion</h1>
        <p class="subtitle">Create your account</p>
		<p class="subtitle" id="errorMessage" style="color: red;"></p>
        <form id="registrationForm" class="register-form">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="name" name="name" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
            </div> 
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter Password" required>
            </div>
            <button type="submit" class="btn-register">Register</button>
        </form>
        <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
    </div>
</body>

<script>

// Assuming your JSON server is running at http://localhost:3000
const apiUrl = 'http://localhost:3000/users';

// Get the registration form and attach an event listener
const registrationForm = document.getElementById('registrationForm');
registrationForm.addEventListener('submit', async (event) => {
  event.preventDefault();

  // Get the username and password from the form
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  role = '';
  if(username.indexOf(".dr") != -1)
	role = 'Therapist';
  else if(username.indexOf(".supervis") != -1)
    role = 'Superviser';
  else
    role = 'Patient';

  try {
    // Check if the user already exists
    const response = await fetch(`${apiUrl}?username=${username}`);
    const existingUsers = await response.json();

    if (existingUsers.length > 0) {
      // User already exists
      document.getElementById('errorMessage').textContent = 'User already exists. Please choose a different username.';
      //document.getElementById('message').textContent = '';
    } else {
      // User doesn't exist, proceed with registration
      const registrationResponse = await fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username, password, name, phone, role })
      });

      if (registrationResponse.ok) {
        const newUser = await registrationResponse.json();
        //document.getElementById('message').textContent = `User ${newUser.username} registered successfully!`;
        document.getElementById('errorMessage').textContent = '';
		window.location="login.html";
      } else {
        // Handle non-200 responses during registration
        document.getElementById('errorMessage').textContent = 'Error registering user. Please try again.';
        //document.getElementById('message').textContent = '';
      }
    }
  } catch (error) {
    console.error('Error:', error);
    // Display a generic error message
    document.getElementById('errorMessage').textContent = 'An error occurred during registration';

  }
});



    function register(){
        window.location="login.html"
    }

</script>

</html>
