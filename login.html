<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therahub - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        .logo img {
            width: 70px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 2em;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }

        .input-group i {
            margin-right: 10px;
            color: #666;
        }

        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-login {
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: #0056b3;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .remember-me label {
            margin-left: 5px;
        }

        .forgot-password {
            color: #007BFF;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .register-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #007BFF;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="C:\Users\SAI SINDHU\OneDrive\Desktop\voices\THERAfusion.png" alt="Therahub Logo"> <!-- Replace logo.png with your logo file -->
        </div>
        <h1 class="title">Therafusion</h1>
        <p class="subtitle">Welcome back! Please login to your account.</p>
		<p class="subtitle" id="errorMessage" style="color: red;"></p>
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <div class="options">
            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>
            <a href="#" class="forgot-password">Forgot Password?</a>
        </div>
        <p class="register-link">Don't have an account? <a href="registeruser.html">Register here</a></p>
    </div>
</body>

<script>

const apiUrl = 'http://localhost:3000/users';

// Get the login form and attach an event listener
const loginForm = document.getElementById('loginForm');
loginForm.addEventListener('submit', async (event) => {
  event.preventDefault();

  // Get the username and password from the form
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  try {
    // Make a GET request to check for username and password
    const response = await fetch(apiUrl);
    const users = await response.json();

    // Check if the user is authenticated
    const user = users.find(user => user.username === username && user.password === password);
	console.log(user);

    if (user) {
        
		if(user.role == 'Therapist')
		{
			 window.location.href = 'therapist.html?user='+user.username;
		}
		else if(user.role == 'Superviser')
		{
			 window.location.href = 'superviser.html?user='+user.username;
		}
        else if(user.role == 'Admin')
		{
			 window.location.href = 'admin.html?user='+user.username;
		}
		else
		{
			window.location.href = 'beforehp.html?user='+user.username;
		}
      
      
    } else {
      // Display the error message
      document.getElementById('errorMessage').textContent = 'Invalid username or password';
    }
  } catch (error) {
    console.error('Error:', error);
    // Display a generic error message
    document.getElementById('errorMessage').textContent = 'An error occurred during authentication';
  }
});

</script>

</html>
