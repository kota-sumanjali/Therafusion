    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1517685352820-1b2b1c6e1e5e'); /* Background image */
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 20px;
            color: white; /* Text color for better contrast */
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Align items to the left */
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 50px; /* Adjust the logo size */
            margin-right: 10px;
        }

        h1 {
            color: #4CAF50; /* Main title color */
            font-size: 24px;
            margin: 0;
        }

        h2 {
            color:#555 ; /* Subtitle color */
            font-size: 18px;
            margin: 10px 0 20px;
        }

        .image-container {
            display: flex; /* Display images in a row */
            justify-content: center; /* Center images */
            gap: 20px; /* Space between images */
            margin-bottom: 20px;
        }

        .image-container img {
            width: 100px; /* Adjust image size */
            height: auto; /* Maintain aspect ratio */
        }

        .audio-container {
            display: flex; /* Display audio controls in a row */
            justify-content: center; /* Center audio controls */
            gap: 20px; /* Space between audio controls */
        }

        audio {
            width: 120px; /* Width of audio player */
        }

        footer {
             /* Semi-transparent background */
            color: #008000;
            text-align: center;
            padding: 10px;
            width: 100%;
            position: relative;
            bottom: 0; /* Stick to bottom */
            margin-top: auto; /* Push footer to the bottom */
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            color: #4CAF50; /* Link color */
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline; /* Underline on hover */
        }

        /* Back to Home Button */
        .back-button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }

        .back-button:hover {
            background-color: #45a049;
        }

        /* Button Container */
        .button-container {
            display: flex;
            justify-content: flex-end; /* Align button to the right */
            width: 100%; /* Full width to push button to the right */
            margin-top: 20px; /* Add some space above the button */
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: center;
            }

            .logo {
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
