<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therafusion</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1517685352820-1b2b1c6e1e5e'); /* Replace with your background image URL */
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensure full height */
            color: white; /* Text color for better contrast */
        }

        .content {
            flex: 1; /* Allow content to grow and take available space */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            z-index: 1; /* Ensure header is above background */
        }

        .logo {
            width: 70px; /* Adjust the logo size */
            margin-bottom: 10px;
            animation: bounce 1s infinite; /* Logo bounce animation */
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        h1 {
            color: #4CAF50; /* Main title color */
            font-size: 36px;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            animation: slideIn 1s ease-in-out; /* Title slide in animation */
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h2 {
            color: #555; /* Subtitle color */
            font-size: 24px;
            margin: 5px 0 20px;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px; /* Space between buttons */
            margin-top: 20px;
            z-index: 1; /* Ensure buttons are above background */
        }

        .round-button {
            background-color: rgba(76, 175, 80, 0.9); /* Button color with transparency */
            color: white;
            border: none;
            border-radius: 50%; /* Round shape */
            width: 150px; /* Button size */
            height: 150px; /* Button size */
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, transform 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            outline: none;
        }

        .round-button:hover {
            background-color: #45a049; /* Darker shade on hover */
            transform: translateY(-2px); /* Lift effect */
        }

        .round-button:active {
            transform: translateY(1px); /* Press effect */
        }

        /* Footer Styles */
        footer { /* Semi-transparent background */
            color: #008000;
            text-align: center;
            padding: 10px;
            width: 100%;
            z-index: 1; /* Ensure footer is above background */
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            color: #4CAF50; /* Link color */
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline; /* Underline on hover */
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .round-button {
                width: 120px; /* Smaller button size */
                height: 120px; /* Smaller button size */
                font-size: 16px;
            }

            h1 {
                font-size: 28px; /* Smaller title size */
            }

            h2 {
                font-size: 20px; /* Smaller subtitle size */
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <div class="header">
            <img src="C:\Users\SAI SINDHU\OneDrive\Desktop\voices\THERAfusion.png" alt="Logo" class="logo"> <!-- Replace with your logo URL -->
            <h1>Therafusion</h1>
            <h2>THERAPIES</h2>
        </div>

        <div class="button-container">
            <button class="round-button" onclick="callMe('speech')">Speech Therapy</button>
            <button class="round-button" onclick="callMe('Behaviour')">Behavioural Therapy</button>
            <button class="round-button" onclick="callMe('Autism Therapy')">Autism Therapy</button>
            <button class="round-button" onclick="callMe('Occupational therapy')">Occupational Therapy</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Therafusion. All rights reserved.</p>
        <p><a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
        <p>Contact us: <a href="mailto:info@therafusion.com">info@therafusion.com</a></p>
    </footer>

</body>
</html>

<script>
function callMe(type)
{
	if(type == 'speech' || type == 'Behaviour' || type == 'Autism Therapy' || type == 'Occupational therapy'){
		window.location='patient.html';
	}

}
</script>
